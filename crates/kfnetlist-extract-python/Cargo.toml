[package]
name = "kfnetlist-extract-python"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/flaport/kfnetlist"
publish = false
description = "KFNetlist extraction bindings linked into the RLayout extension"

[dependencies]
kfnetlist-extract = { path = "../kfnetlist-extract" }
pyo3 = "0.29.2"
rlayout-python = { git = "ssh://git@github.com/doplaydo/rlayout", rev = "a4733c8cad56c35f127b4f6865b07fbe223679e1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
pythonize = "0.29"
kfnetlist-core = { path = "../kfnetlist-core" }

# Keep model-only workspace resolution independent of the native engine.
[workspace]
resolver = "2"
