[package]
name = "kfnetlist-extract"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/flaport/kfnetlist"
description = "Python-independent netlist extraction using RLayout"

[dependencies]
kfnetlist-core = { path = "../kfnetlist-core" }
rlayout = { git = "ssh://git@github.com/doplaydo/rlayout", rev = "a4733c8cad56c35f127b4f6865b07fbe223679e1" }
indexmap = { version = "2", features = ["serde"] }
serde_json = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }

# Keep model-only workspace resolution independent of the native engine.
[workspace]
resolver = "2"
